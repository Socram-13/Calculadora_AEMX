<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="imagen_1.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAPA · ATLAS EARTH AEMX</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #060b14;
      --panel:     #0b1626;
      --panel2:    #0f1e35;
      --border:    #1a3a5c;
      --glow:      #00c8ff;
      --glow2:     #00ff9d;
      --gold:      #ffd700;
      --epic:      #c084fc;
      --rare:      #60a5fa;
      --common:    #4ade80;
      --legendary: #facc15;
      --text:      #cce4ff;
      --text2:     #6b8ab0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      animation: gridMove 20s linear infinite;
      pointer-events: none;
    }
    @keyframes gridMove { 0%{transform:translateY(0)} 100%{transform:translateY(40px)} }
    body::after {
      content: '';
      position: fixed;
      top:-50%;left:-50%;width:200%;height:200%;
      background:
        radial-gradient(ellipse at 30% 20%,rgba(0,200,255,0.06) 0%,transparent 50%),
        radial-gradient(ellipse at 70% 80%,rgba(0,255,157,0.04) 0%,transparent 50%);
      z-index:0;pointer-events:none;
    }
    .container { position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:12px 16px 40px; }
    .header-bar {
      display:flex;align-items:center;justify-content:space-between;
      background:linear-gradient(135deg,#0b1f3a 0%,#060f1e 100%);
      border:3px solid var(--border);border-radius:14px;padding:12px 20px;
      margin-bottom:14px;position:relative;overflow:hidden;
    }
    .header-bar::before {
      content:'';position:absolute;top:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,#00c8ff,#4ade80,#facc15,#c084fc,#00c8ff);
      background-size:200% 100%;animation:rainbowSlide 6s linear infinite;
    }
    @keyframes rainbowSlide{0%{background-position:0% 0}100%{background-position:200% 0}}
    .header-title { font-family:'Orbitron',monospace;font-size:clamp(14px,3vw,24px);font-weight:900;letter-spacing:3px;color:var(--glow);text-shadow:0 0 20px rgba(0,200,255,0.5); }
    .header-title span{color:var(--legendary)}
    .header-nav{display:flex;gap:8px;flex-wrap:wrap}
    .nav-btn{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;letter-spacing:2px;padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;text-decoration:none;transition:all .2s}
    .nav-btn:hover{border-color:var(--glow);color:var(--glow)}
    .stats-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
    .stat-card{background:var(--panel);border:2px solid var(--border);border-radius:10px;padding:10px 18px;flex:1;min-width:120px;text-align:center;transition:border-color .2s}
    .stat-card:hover{border-color:var(--glow)}
    .stat-num{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;color:var(--glow);text-shadow:0 0 12px rgba(0,200,255,0.4)}
    .stat-label{font-size:10px;letter-spacing:2px;color:var(--text2);text-transform:uppercase;margin-top:2px}
    .map-wrap{background:var(--panel);border:3px solid var(--border);border-radius:14px;overflow:hidden;position:relative}
    .map-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--glow),transparent);z-index:10}
    #globe-canvas{width:100%;height:580px;display:block;cursor:grab}
    #globe-canvas:active{cursor:grabbing}
    .map-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;background:rgba(6,11,20,0.85);pointer-events:none;transition:opacity .4s}
    .map-loading.hidden{opacity:0;pointer-events:none}
    .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--glow);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:3px;color:var(--glow)}
    .globe-popup{position:absolute;background:var(--panel);border:1px solid var(--glow);border-radius:10px;box-shadow:0 0 20px rgba(0,200,255,0.3);color:var(--text);font-family:'Rajdhani',sans-serif;padding:12px 14px;min-width:180px;max-width:280px;pointer-events:none;z-index:20;display:none}
    .globe-popup.visible{display:block}
    .popup-name{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;color:var(--glow)}
    .popup-total{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text2);margin-top:2px}
    .popup-city{font-size:11px;color:var(--text2);margin-top:2px}
    .globe-controls{position:absolute;right:14px;top:14px;z-index:15;display:flex;flex-direction:column;gap:6px}
    .ctrl-btn{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;letter-spacing:1px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap}
    .ctrl-btn:hover{border-color:var(--glow);color:var(--glow)}
    .ctrl-btn.active{border-color:var(--glow);color:var(--glow);background:rgba(0,200,255,0.08)}
    .map-wrap.is-fullscreen{position:fixed!important;inset:0!important;border-radius:0!important;border:none!important;z-index:9999!important}
    .map-wrap.is-fullscreen #globe-canvas{height:100vh!important}
    .legend{background:var(--panel);border:2px solid var(--border);border-radius:10px;padding:12px 16px;margin-top:12px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .legend-title{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:3px;color:var(--text2);text-transform:uppercase;margin-right:4px}
    .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text)}
    .municipios-panel{background:var(--panel);border:2px solid var(--border);border-radius:14px;padding:16px 20px;margin-top:14px;position:relative;overflow:hidden}
    .municipios-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ff4d4d,transparent)}
    .municipios-title{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;letter-spacing:3px;color:#ff4d4d;text-shadow:0 0 10px rgba(255,77,77,0.4);margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .municipios-input-row{display:flex;gap:8px;margin-bottom:14px}
    .municipios-input{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
    .municipios-input:focus{border-color:#ff4d4d}
    .municipios-input::placeholder{color:var(--text2)}
    .municipios-add-btn{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;letter-spacing:1px;padding:8px 16px;border-radius:8px;border:1px solid #ff4d4d;background:rgba(255,77,77,0.1);color:#ff4d4d;cursor:pointer;transition:all .2s;white-space:nowrap}
    .municipios-add-btn:hover{background:rgba(255,77,77,0.2);box-shadow:0 0 10px rgba(255,77,77,0.3)}
    .municipios-list{display:flex;flex-wrap:wrap;gap:8px;max-height:160px;overflow-y:auto}
    .municipio-tag{display:flex;align-items:center;gap:6px;background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.4);border-radius:20px;padding:4px 12px 4px 10px;font-size:12px;color:#ff9999;transition:all .2s}
    .municipio-tag:hover{border-color:#ff4d4d}
    .municipio-dot{width:8px;height:8px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 6px #ff4d4d;flex-shrink:0}
    .municipio-del{background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px;line-height:1;padding:0;transition:color .2s;margin-left:2px}
    .municipio-del:hover{color:#ff4d4d}
    .municipios-empty{color:var(--text2);font-size:12px;font-style:italic}
    .municipio-suggestions{display:none;position:absolute;top:100%;left:0;right:0;background:var(--panel2);border:1px solid #ff4d4d;border-top:none;border-radius:0 0 8px 8px;z-index:99999;max-height:200px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,0.6)}
    .suggestion-item{padding:8px 14px;font-size:13px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
    .suggestion-item:last-child{border-bottom:none}
    .suggestion-item:hover{background:rgba(255,77,77,0.15);color:#ff9999}
    @media(max-width:600px){#globe-canvas{height:420px}.stats-bar{gap:6px}.stat-num{font-size:18px}}
  </style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script type="module">
import { initializeApp }       from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getDatabase, ref, onValue }   from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const firebaseConfig = {
  apiKey:        'AIzaSyB-xx2PlBjvnHe0K7Bf1MspVqUlfjky0mk',
  authDomain:    'aemx-chat.firebaseapp.com',
  databaseURL:   'https://aemx-chat-default-rtdb.firebaseio.com',
  projectId:     'aemx-chat',
  storageBucket: 'aemx-chat.appspot.com',
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

// ── Three.js setup ──
const canvas   = document.getElementById('globe-canvas');
const W = () => canvas.clientWidth;
const H = () => canvas.clientHeight;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.setClearColor(0x060b14, 1);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, W()/H(), 0.1, 1000);
camera.position.z = 2.8;

const GLOBE_R = 1.0;

// ── Globo ──
const globeGeo  = new THREE.SphereGeometry(GLOBE_R, 64, 64);
const globeMat  = new THREE.MeshPhongMaterial({ color:0x0a1a30, emissive:0x001525, specular:0x112244, shininess:15 });
const globeMesh = new THREE.Mesh(globeGeo, globeMat);

// Atmósfera
const atmosMesh = new THREE.Mesh(
  new THREE.SphereGeometry(GLOBE_R*1.04, 64, 64),
  new THREE.MeshPhongMaterial({ color:0x00c8ff, transparent:true, opacity:0.07, side:THREE.FrontSide })
);

// Grid lat/lng
const gridGroup = new THREE.Group();
const gridMat   = new THREE.LineBasicMaterial({ color:0x1a3a5c, transparent:true, opacity:0.4 });
function latLngToVec3(lat, lng, r) {
  const phi   = (90 - lat)  * (Math.PI/180);
  const theta = (lng + 180) * (Math.PI/180);
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}
for (let lat = -80; lat <= 80; lat += 20) {
  const pts = [];
  for (let lng = 0; lng <= 360; lng += 3) pts.push(latLngToVec3(lat, lng, GLOBE_R*1.001));
  gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
}
for (let lng = 0; lng < 360; lng += 20) {
  const pts = [];
  for (let lat = -90; lat <= 90; lat += 3) pts.push(latLngToVec3(lat, lng, GLOBE_R*1.001));
  gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
}

// Pivot para rotar todo junto
const pivot = new THREE.Group();
pivot.add(globeMesh, atmosMesh, gridGroup);
scene.add(pivot);

// Iluminación
scene.add(new THREE.AmbientLight(0x223355, 1.3));
const sun = new THREE.DirectionalLight(0x00c8ff, 0.6);
sun.position.set(5, 3, 5);
scene.add(sun);
const backLight = new THREE.DirectionalLight(0x00ff9d, 0.2);
backLight.position.set(-5, -3, -5);
scene.add(backLight);

// Estrellas
const sv = [];
for (let i = 0; i < 2000; i++) {
  const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1), r = 80+Math.random()*20;
  sv.push(r*Math.sin(ph)*Math.cos(th), r*Math.sin(ph)*Math.sin(th), r*Math.cos(ph));
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sv, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xaaccff, size:0.06, transparent:true, opacity:0.6 })));

// Grupos de capas (también dentro del pivot para rotar juntos)
const markersGroup    = new THREE.Group();
const linesGroup      = new THREE.Group();
const municipiosGroup = new THREE.Group();
pivot.add(markersGroup, linesGroup, municipiosGroup);

// ── Helpers ──
function makeSprite(hexColor, size = 0.030) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const cx = 32, cy = 32;
  const col = hexColor.replace('#','');
  const r = parseInt(col.substring(0,2),16), g = parseInt(col.substring(2,4),16), b = parseInt(col.substring(4,6),16);
  const grd = ctx.createRadialGradient(cx,cy,0,cx,cy,28);
  grd.addColorStop(0,   `rgba(${r},${g},${b},1)`);
  grd.addColorStop(0.5, `rgba(${r},${g},${b},0.7)`);
  grd.addColorStop(1,   `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(cx,cy,28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx,cy,7,0,Math.PI*2); ctx.fill();
  const mat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent:true, depthTest:false });
  const s = new THREE.Sprite(mat);
  s.scale.set(size,size,size);
  return s;
}

function arcBetween(posA, posB, color) {
  const mid = new THREE.Vector3().addVectors(posA,posB).multiplyScalar(0.5);
  mid.normalize().multiplyScalar(GLOBE_R + 0.22);
  const pts = [];
  for (let t = 0; t <= 1; t += 0.025) {
    const p = new THREE.Vector3()
      .copy(posA).multiplyScalar((1-t)*(1-t))
      .addScaledVector(mid, 2*t*(1-t))
      .addScaledVector(posB, t*t);
    pts.push(p);
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: new THREE.Color(color), transparent:true, opacity:0.55 });
  return new THREE.Line(geo, mat);
}

function clearGroup(g) { while(g.children.length) g.remove(g.children[0]); }

// ── Colores ──
const COLORS = ['#00c8ff','#00ff9d','#c084fc','#60a5fa','#facc15','#4ade80','#f472b6'];
function playerColor(p) {
  if (p.borderColor) return p.borderColor;
  if (p.username.toUpperCase().includes('AEMX')) return '#00ff9d';
  return COLORS[(p.username||'?').toUpperCase().charCodeAt(0) % COLORS.length];
}

// ── Estado ──
let jugadoresOn = true;
let lineasOn    = true;
const spriteMap = new Map();

function buildLines(players) {
  clearGroup(linesGroup);
  const wc = players.filter(p => p.coords);
  if (wc.length < 2) return;
  const visited = new Array(wc.length).fill(false);
  const order = []; visited[0] = true; order.push(wc[0]);
  for (let i = 1; i < wc.length; i++) {
    const last = order[order.length-1];
    let bi = -1, bd = Infinity;
    wc.forEach((p,j) => {
      if (visited[j]) return;
      const d = Math.hypot(p.coords[0]-last.coords[0], p.coords[1]-last.coords[1]);
      if (d < bd) { bd=d; bi=j; }
    });
    if (bi<0) break;
    visited[bi] = true; order.push(wc[bi]);
  }
  for (let i = 0; i < order.length-1; i++) {
    const t = i/(order.length-1);
    const r = Math.round(t*192), g = Math.round(200-t*68), b = Math.round(255-t*123);
    const col = `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
    const va = latLngToVec3(order[i].coords[0],   order[i].coords[1],   GLOBE_R*1.012);
    const vb = latLngToVec3(order[i+1].coords[0], order[i+1].coords[1], GLOBE_R*1.012);
    linesGroup.add(arcBetween(va, vb, col));
  }
  linesGroup.visible = lineasOn && jugadoresOn;
}

function renderGlobe(players) {
  clearGroup(markersGroup);
  spriteMap.clear();
  players.filter(p => p.coords).forEach(p => {
    const v = latLngToVec3(p.coords[0], p.coords[1], GLOBE_R*1.013);
    const s = makeSprite(playerColor(p));
    s.position.copy(v);
    s.userData = { player: p };
    markersGroup.add(s);
    spriteMap.set(p.uid, s);
  });
  buildLines(players);
  markersGroup.visible = jugadoresOn;

  const paises  = new Set(players.map(p=>p.country).filter(Boolean)).size;
  const ciudades= new Set(players.map(p=>p.city).filter(Boolean)).size;
  const aemx    = players.filter(p=>p.username.toUpperCase().includes('AEMX')).length;
  document.getElementById('statJugadores').textContent = players.length;
  document.getElementById('statPaises').textContent    = paises||'—';
  document.getElementById('statCiudades').textContent  = ciudades;
  document.getElementById('statAemx').textContent      = aemx;
  document.getElementById('mapLoading').classList.add('hidden');
}

// ── Coords ──
const COORDS_CACHE = {};
async function geocodeCity(city) {
  const key = city.toLowerCase().trim();
  if (COORDS_CACHE[key]) return COORDS_CACHE[key];
  try {
    const url = `https://corsproxy.io/?url=${encodeURIComponent(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1&accept-language=es`
    )}`;
    const data = await (await fetch(url)).json();
    if (data[0]) { const c=[parseFloat(data[0].lat),parseFloat(data[0].lon)]; COORDS_CACHE[key]=c; return c; }
  } catch(e) {}
  return null;
}

function coordsInstant(city, sinCiudad) {
  if (sinCiudad || !city) return [20+(Math.random()-0.5)*40, (Math.random()-0.5)*60];
  const parts  = city.split(',');
  const estado = parts.length>=2 ? parts[parts.length-1].trim() : CIUDAD_ESTADO[city.toLowerCase().trim()]||null;
  if (estado && ESTADO_COORDS[estado]) {
    const b = ESTADO_COORDS[estado];
    return [b[0]+(Math.random()-0.5)*1.5, b[1]+(Math.random()-0.5)*1.5];
  }
  return [20+(Math.random()-0.5)*40, (Math.random()-0.5)*60];
}

// ── Load players ──
async function loadPlayers(currentUid) {
  onValue(ref(db,'users'), async snapshot => {
    document.getElementById('mapLoading').classList.remove('hidden');
    const raw = [];
    snapshot.forEach(child => {
      const d = child.val();
      if (!d.username || d.bannedLeaderboard) return;
      const total = (parseInt(d.common)||0)+(parseInt(d.rare)||0)+(parseInt(d.epic)||0)+(parseInt(d.legendary)||0);
      raw.push({ uid:child.key, username:d.username, borderColor:d.borderColor||'', city:d.city||'', country:d.country||'', total, isYou:child.key===currentUid, sinCiudad:!d.city });
    });
    raw.forEach(p => { p.coords = coordsInstant(p.city, p.sinCiudad); });
    renderGlobe(raw);

    const batch = 5;
    for (let i = 0; i < raw.length; i += batch) {
      let changed = false;
      await Promise.all(raw.slice(i,i+batch).map(async p => {
        if (p.sinCiudad || !p.city) return;
        const exact = await geocodeCity(p.city);
        if (!exact) return;
        p.coords = exact;
        const s = spriteMap.get(p.uid);
        if (s) { s.position.copy(latLngToVec3(exact[0], exact[1], GLOBE_R*1.013)); changed=true; }
      }));
      if (changed) buildLines(raw);
      if (i+batch < raw.length) await new Promise(r=>setTimeout(r,300));
    }
  });
}

let isDragging = false, autoRotate = true;
let prevMouse  = {x:0,y:0};

canvas.addEventListener('mousedown', e=>{isDragging=true;autoRotate=false;prevMouse={x:e.clientX,y:e.clientY}});
canvas.addEventListener('touchstart',e=>{isDragging=true;autoRotate=false;prevMouse={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
window.addEventListener('mouseup',  ()=>isDragging=false);
window.addEventListener('touchend', ()=>isDragging=false);

window.addEventListener('mousemove', e=>{
  if(!isDragging) return;
  pivot.rotation.y += (e.clientX - prevMouse.x)*0.005;
  pivot.rotation.x += (e.clientY - prevMouse.y)*0.005;
  pivot.rotation.x  = Math.max(-Math.PI/2, Math.min(Math.PI/2, pivot.rotation.x));
  prevMouse = {x:e.clientX, y:e.clientY};
});
window.addEventListener('touchmove', e=>{
  if(!isDragging) return;

},{passive:true});

// ── Popup con raycasting ──
const raycaster = new THREE.Raycaster();
const mouse2d   = new THREE.Vector2();
const popup     = document.getElementById('globePopup');

canvas.addEventListener('mousemove', e=>{
  if(isDragging){popup.classList.remove('visible');return;}
  const rect = canvas.getBoundingClientRect();
  mouse2d.x =  ((e.clientX-rect.left)/rect.width )*2-1;
  mouse2d.y = -((e.clientY-rect.top) /rect.height)*2+1;
  raycaster.setFromCamera(mouse2d, camera);
  const hits = raycaster.intersectObjects([...markersGroup.children,...municipiosGroup.children],false);
  if (hits.length) {
    const ud = hits[0].object.userData;
    const p  = ud.player || ud.municipio;
    if (p) {
      popup.innerHTML = ud.player
        ? `<div class="popup-name">${p.username}</div>
           <div class="popup-total">${p.total.toLocaleString()} parcelas</div>
           <div class="popup-city">📍 ${p.city||'<i style="color:#6b8ab0">Sin ciudad</i>'}</div>
           ${p.country?`<div class="popup-city">🌍 ${p.country}</div>`:''}`
        : `<div class="popup-name" style="color:#ff4d4d">📍 ${p.name.toUpperCase()}</div><div class="popup-city">Municipio de interés</div>`;
      popup.style.left = (e.clientX-canvas.getBoundingClientRect().left+12)+'px';
      popup.style.top  = (e.clientY-canvas.getBoundingClientRect().top -10)+'px';
      popup.classList.add('visible');
      canvas.style.cursor='pointer';
      return;
    }
  }
  popup.classList.remove('visible');
  canvas.style.cursor = isDragging?'grabbing':'grab';
});
canvas.addEventListener('mouseleave',()=>popup.classList.remove('visible'));

// Exponer para municipios
window._addMunicipioGlobe = (name, coords)=>{
  if(!coords) return;
  const s = makeSprite('#ff4d4d', 0.026);
  s.position.copy(latLngToVec3(coords[0],coords[1],GLOBE_R*1.016));
  s.userData = { municipio:{name} };
  municipiosGroup.add(s);
  window._municipioSprites = window._municipioSprites||{};
  window._municipioSprites[name]=s;
};
window._removeMunicipioGlobe = name=>{
  const s=window._municipioSprites?.[name];
  if(s){municipiosGroup.remove(s);delete window._municipioSprites[name];}
};

<script>
const LS_KEY = 'aemx_municipios';
function getMunicipios(){try{return JSON.parse(localStorage.getItem(LS_KEY))||[];}catch{return[];}}
function saveMunicipios(list){localStorage.setItem(LS_KEY,JSON.stringify(list));}

function renderMunicipiosList(){
  const list=getMunicipios(),el=document.getElementById('municipiosList'),empty=document.getElementById('municipiosEmpty');
  [...el.querySelectorAll('.municipio-tag')].forEach(t=>t.remove());
  empty.style.display=list.length?'none':'';
  list.forEach(m=>{
    const tag=document.createElement('div');tag.className='municipio-tag';
    tag.innerHTML=`<div class="municipio-dot"></div><span>${m.name}</span><button class="municipio-del" title="Eliminar">×</button>`;
    tag.querySelector('.municipio-del').addEventListener('click',()=>removeMunicipio(m.name));
    el.appendChild(tag);
  });
}

function addMunicipio(name,coords){
  const t=name.trim();if(!t)return;
  const list=getMunicipios();
  if(list.find(m=>m.name.toLowerCase()===t.toLowerCase()))return;
  list.push({name:t,coords});saveMunicipios(list);renderMunicipiosList();
  if(window._addMunicipioGlobe) window._addMunicipioGlobe(t,coords);
}

function removeMunicipio(name){
  if(window._removeMunicipioGlobe) window._removeMunicipioGlobe(name);
  saveMunicipios(getMunicipios().filter(m=>m.name!==name));renderMunicipiosList();
}

let selectedSuggestion=null,searchTimer=null;
const municipioInput=document.getElementById('municipioInput'),municipioAddBtn=document.getElementById('municipioAddBtn'),suggestionsBox=document.getElementById('municipioSuggestions');

async function buscarSugerencias(q){
  if(q.length<2){hideSuggestions();return;}
  try{
    const url=`https://corsproxy.io/?url=${encodeURIComponent(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q+' Mexico')}&format=json&limit=8&addressdetails=1&accept-language=es&countrycodes=mx`)}`;
    const data=await(await fetch(url)).json();
    if(!data.length){hideSuggestions();return;}
    showSuggestions(data);
  }catch(e){hideSuggestions();}
}

function showSuggestions(results){
  suggestionsBox.innerHTML='';let shown=0;
  results.forEach(r=>{
    if(!r.display_name)return;
    const coords=[parseFloat(r.lat),parseFloat(r.lon)];
    const label=r.display_name.split(',').map(s=>s.trim()).slice(0,3).join(', ');
    const item=document.createElement('div');item.className='suggestion-item';item.textContent=label;
    item.addEventListener('mousedown',e=>{e.preventDefault();selectedSuggestion={name:label,coords};municipioInput.value=label;hideSuggestions();});
    suggestionsBox.appendChild(item);shown++;
  });
  if(shown>0)suggestionsBox.style.display='block';else hideSuggestions();
}
function hideSuggestions(){suggestionsBox.style.display='none';suggestionsBox.innerHTML='';}

municipioInput.addEventListener('input',()=>{selectedSuggestion=null;clearTimeout(searchTimer);searchTimer=setTimeout(()=>buscarSugerencias(municipioInput.value),350);});
municipioInput.addEventListener('blur',()=>setTimeout(hideSuggestions,150));
municipioInput.addEventListener('keydown',e=>{if(e.key==='Escape')hideSuggestions();if(e.key==='Enter')municipioAddBtn.click();});
municipioAddBtn.addEventListener('click',()=>{
  const val=municipioInput.value.trim();if(!val)return;
  if(selectedSuggestion)addMunicipio(selectedSuggestion.name,selectedSuggestion.coords);
  else addMunicipio(val,null);
  municipioInput.value='';selectedSuggestion=null;hideSuggestions();municipioInput.focus();
});

window.addEventListener('load',()=>{
  const tryLoad=()=>{
    if(window._addMunicipioGlobe){getMunicipios().forEach(m=>{if(m.coords)window._addMunicipioGlobe(m.name,m.coords);});renderMunicipiosList();}
    else setTimeout(tryLoad,300);
  };
  tryLoad();
});
</script>
