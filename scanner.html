<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1923;
    --card: #1a2535;
    --card2: #1f2d42;
    --accent: #00c8ff;
    --gold: #F5A623;
    --green: #00ff9d;
    --purple: #c084fc;
    --blue: #60a5fa;
    --common: #4ade80;
    --rare: #60a5fa;
    --epic: #c084fc;
    --legendary: #fbbf24;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --border: rgba(255,255,255,0.07);
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    background-image: radial-gradient(ellipse at 20% 20%, rgba(0,200,255,0.06) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, rgba(245,166,35,0.05) 0%, transparent 60%);
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: 32px;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text2);
    margin-top: 4px;
    font-weight: 600;
  }

  /* Upload Zone */
  .upload-zone {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 2px dashed rgba(0,200,255,0.3);
    border-radius: 20px;
    padding: 36px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }

  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: rgba(0,200,255,0.06);
  }

  .upload-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }

  .upload-icon {
    font-size: 48px;
    margin-bottom: 12px;
    display: block;
  }

  .upload-title {
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .upload-hint {
    font-size: 12px;
    color: var(--text2);
  }

  /* Preview */
  .preview-wrap {
    width: 100%;
    max-width: 460px;
    margin-top: 16px;
    display: none;
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid var(--border);
    position: relative;
  }

  .preview-wrap img {
    width: 100%;
    max-height: 280px;
    object-fit: cover;
    display: block;
  }

  .preview-badge {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(0,200,255,0.9);
    color: #000;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 20px;
  }

  /* Scan Button */
  .btn-scan {
    margin-top: 18px;
    width: 100%;
    max-width: 460px;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent), #0080a0);
    border: none;
    border-radius: 14px;
    color: #000;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    display: none;
    box-shadow: 0 4px 20px rgba(0,200,255,0.3);
  }

  .btn-scan:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,200,255,0.4); }
  .btn-scan:active { transform: translateY(0); }
  .btn-scan:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Loader */
  .loader {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 24px;
  }

  .spinner {
    width: 44px; height: 44px;
    border: 3px solid rgba(0,200,255,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    font-size: 13px;
    color: var(--text2);
    font-weight: 700;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Result Card */
  .result-card {
    display: none;
    width: 100%;
    max-width: 460px;
    margin-top: 24px;
    background: var(--card);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    animation: slideUp 0.4s ease;
  }

  @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

  .result-header {
    background: linear-gradient(135deg, #1a3a4a, #1a2535);
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    text-align: center;
  }

  .result-title {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: var(--gold);
    letter-spacing: 1px;
  }

  .result-username {
    font-size: 14px;
    color: var(--accent);
    font-weight: 700;
    margin-top: 4px;
  }

  .result-body {
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Row stats */
  .stat-row {
    display: flex;
    gap: 10px;
  }

  .stat-box {
    flex: 1;
    background: var(--card2);
    border-radius: 12px;
    padding: 12px 14px;
    text-align: center;
    border: 1px solid var(--border);
  }

  .stat-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 4px;
  }

  .stat-value {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
  }

  .stat-value.ab    { color: var(--gold); }
  .stat-value.gems  { color: var(--accent); }
  .stat-value.boost { color: #f472b6; }

  /* Parcelas grid */
  .parcelas-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .parcela-box {
    background: var(--card2);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    border: 1px solid var(--border);
  }

  .parcela-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .parcela-label.common    { color: var(--common); }
  .parcela-label.rare      { color: var(--rare); }
  .parcela-label.epic      { color: var(--epic); }
  .parcela-label.legendary { color: var(--legendary); }

  .parcela-value {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
  }

  .parcela-value.common    { color: var(--common); }
  .parcela-value.rare      { color: var(--rare); }
  .parcela-value.epic      { color: var(--epic); }
  .parcela-value.legendary { color: var(--legendary); }

  /* Save button */
  .btn-save {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #16a34a, #065f46);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: 'Fredoka One', cursive;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 4px;
    box-shadow: 0 4px 16px rgba(22,163,74,0.3);
  }

  .btn-save:hover { transform: translateY(-2px); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #16a34a;
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: 50px;
    transition: transform 0.3s ease;
    z-index: 999;
    pointer-events: none;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Error */
  .error-box {
    display: none;
    width: 100%;
    max-width: 460px;
    margin-top: 16px;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 13px;
    color: #fca5a5;
    text-align: center;
    font-weight: 700;
  }

  /* New scan */
  .btn-new {
    width: 100%;
    max-width: 460px;
    margin-top: 12px;
    padding: 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text2);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: none;
  }

  .btn-new:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="logo">🌎 Atlas Scanner</div>
  <div class="subtitle">Escanea tu perfil de Atlas Earth</div>
</header>

<!-- Upload Zone -->
<div class="upload-zone" id="uploadZone">
  <input type="file" id="fileInput" accept="image/*">
  <span class="upload-icon">📸</span>
  <div class="upload-title">Sube tu captura de perfil</div>
  <div class="upload-hint">Toca aquí o arrastra la imagen<br>Abre tu perfil en Atlas Earth y toma screenshot</div>
</div>

<!-- Preview -->
<div class="preview-wrap" id="previewWrap">
  <img id="previewImg" src="" alt="preview">
  <span class="preview-badge">✓ Lista</span>
</div>

<!-- Scan Button -->
<button class="btn-scan" id="btnScan" onclick="scanImage()">🔍 ESCANEAR PERFIL</button>

<!-- Loader -->
<div class="loader" id="loader">
  <div class="spinner"></div>
  <div class="loader-text">Analizando imagen...</div>
</div>

<!-- Error -->
<div class="error-box" id="errorBox"></div>

<!-- Result -->
<div class="result-card" id="resultCard">
  <div class="result-header">
    <div class="result-title" id="resTitle">—</div>
    <div class="result-username" id="resUser">—</div>
  </div>
  <div class="result-body">
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-label">💰 Atlas Bucks</div>
        <div class="stat-value ab" id="resAB">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">💎 Diamantes</div>
        <div class="stat-value gems" id="resDiamonds">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">📈 Aumento</div>
        <div class="stat-value boost" id="resBoost">—</div>
      </div>
    </div>

    <div class="parcelas-grid">
      <div class="parcela-box">
        <div class="parcela-label common">Común</div>
        <div class="parcela-value common" id="resCommon">—</div>
      </div>
      <div class="parcela-box">
        <div class="parcela-label rare">Raro</div>
        <div class="parcela-value rare" id="resRare">—</div>
      </div>
      <div class="parcela-box">
        <div class="parcela-label epic">Épico</div>
        <div class="parcela-value epic" id="resEpic">—</div>
      </div>
      <div class="parcela-box">
        <div class="parcela-label legendary">Legendario</div>
        <div class="parcela-value legendary" id="resLegendary">—</div>
      </div>
    </div>

    <button class="btn-save" onclick="saveToLocalStorage()">💾 GUARDAR EN LA APP</button>
  </div>
</div>

<button class="btn-new" id="btnNew" onclick="resetScanner()">↩ Escanear otra imagen</button>

<div class="toast" id="toast">✅ Datos guardados correctamente</div>

<script>
  let imageBase64 = null;
  let extractedData = null;

  const fileInput   = document.getElementById('fileInput');
  const uploadZone  = document.getElementById('uploadZone');
  const previewWrap = document.getElementById('previewWrap');
  const previewImg  = document.getElementById('previewImg');
  const btnScan     = document.getElementById('btnScan');
  const loader      = document.getElementById('loader');
  const resultCard  = document.getElementById('resultCard');
  const errorBox    = document.getElementById('errorBox');
  const btnNew      = document.getElementById('btnNew');

  // Drag & drop
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });

  function handleFile(file) {
    const reader = new FileReader();
    reader.onload = e => {
      imageBase64 = e.target.result.split(',')[1];
      previewImg.src = e.target.result;
      previewWrap.style.display = 'block';
      btnScan.style.display = 'block';
      errorBox.style.display = 'none';
      resultCard.style.display = 'none';
      btnNew.style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  async function scanImage() {
    if (!imageBase64) return;

    btnScan.disabled = true;
    loader.style.display = 'flex';
    errorBox.style.display = 'none';
    resultCard.style.display = 'none';

    const prompt = `Analiza esta captura de pantalla del juego Atlas Earth y extrae EXACTAMENTE los siguientes datos. Responde SOLO con un objeto JSON sin ningún texto adicional, sin markdown, sin backticks:

{
  "titulo": "el rango o título del jugador que aparece en letras grandes (ej: GOVERNOR DE YUCATÁN)",
  "usuario": "el nombre de usuario (ej: AEMX_SOCRAM13)",
  "atlas_bucks": "número junto al ícono de moneda verde/dorada pequeña (NO el número grande de renta)",
  "diamantes": "número junto al ícono de diamante 💎",
  "aumento_pct": "porcentaje de aumento de insignias (solo el número, ej: 20)",
  "comun": "número de parcelas COMÚN en verde",
  "raro": "número de parcelas RARO en azul",
  "epico": "número de parcelas ÉPICO en morado",
  "legendario": "número de parcelas LEGENDARIO en dorado/naranja"
}

Si no puedes leer algún valor con certeza, usa null. No inventes valores.`;

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{
            role: 'user',
            content: [
              { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: imageBase64 } },
              { type: 'text', text: prompt }
            ]
          }]
        })
      });

      const data = await response.json();
      const rawText = data.content.map(b => b.text || '').join('').trim();

      let parsed;
      try {
        const clean = rawText.replace(/```json|```/g, '').trim();
        parsed = JSON.parse(clean);
      } catch {
        throw new Error('No se pudo leer la imagen. Asegúrate de que sea una captura de perfil de Atlas Earth.');
      }

      extractedData = parsed;
      renderResult(parsed);

    } catch (err) {
      errorBox.textContent = err.message || 'Error al analizar la imagen. Intenta de nuevo.';
      errorBox.style.display = 'block';
    } finally {
      loader.style.display = 'none';
      btnScan.disabled = false;
    }
  }

  function renderResult(d) {
    document.getElementById('resTitle').textContent    = d.titulo    || '—';
    document.getElementById('resUser').textContent     = d.usuario   || '—';
    document.getElementById('resAB').textContent       = d.atlas_bucks ?? '—';
    document.getElementById('resDiamonds').textContent = d.diamantes ?? '—';
    document.getElementById('resBoost').textContent    = d.aumento_pct != null ? d.aumento_pct + '%' : '—';
    document.getElementById('resCommon').textContent   = d.comun      ?? '—';
    document.getElementById('resRare').textContent     = d.raro       ?? '—';
    document.getElementById('resEpic').textContent     = d.epico      ?? '—';
    document.getElementById('resLegendary').textContent = d.legendario ?? '—';

    resultCard.style.display = 'block';
    btnNew.style.display = 'block';
    btnScan.style.display = 'none';
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function saveToLocalStorage() {
    if (!extractedData) return;

    const toSave = {
      titulo:      extractedData.titulo      || '',
      usuario:     extractedData.usuario     || '',
      atlas_bucks: extractedData.atlas_bucks ?? '',
      diamantes:   extractedData.diamantes   ?? '',
      aumento_pct: extractedData.aumento_pct ?? '',
      comun:       extractedData.comun       ?? '',
      raro:        extractedData.raro        ?? '',
      epico:       extractedData.epico       ?? '',
      legendario:  extractedData.legendario  ?? '',
      scanned_at:  new Date().toISOString()
    };

    localStorage.setItem('atlas-scanner-data', JSON.stringify(toSave));

    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  function resetScanner() {
    imageBase64 = null;
    extractedData = null;
    fileInput.value = '';
    previewWrap.style.display = 'none';
    btnScan.style.display = 'none';
    resultCard.style.display = 'none';
    btnNew.style.display = 'none';
    errorBox.style.display = 'none';
  }
</script>
</body>
</html>
