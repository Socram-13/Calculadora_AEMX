<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SilhouetteVision</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#030712;color:#e2e8f0;font-family:'Inter',sans-serif;overflow:hidden;height:100dvh;display:flex;flex-direction:column;}
  #header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(3,7,18,0.9);border-bottom:1px solid rgba(99,202,183,0.2);flex-shrink:0;}
  #header h1{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:#63cab7;letter-spacing:2px;}
  #status-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;box-shadow:0 0 6px #ef4444;transition:all 0.3s;}
  #status-dot.active{background:#22c55e;box-shadow:0 0 8px #22c55e;}
  #fps{font-size:10px;color:#64748b;font-family:'Orbitron',monospace;letter-spacing:1px;}
  #canvas-container{position:relative;flex:1;overflow:hidden;background:#000;}
  #videoEl{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;}
  #outputCanvas,#overlayCanvas{position:absolute;top:0;left:0;width:100%;height:100%;}
  #overlayCanvas{pointer-events:none;}
  #toggle-bar{padding:6px 16px;background:rgba(3,7,18,0.95);border-top:1px solid rgba(99,202,183,0.1);display:flex;justify-content:center;gap:8px;flex-shrink:0;}
  .pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.04);border:1px solid rgba(99,202,183,0.2);border-radius:20px;padding:4px 12px;font-size:10px;color:#64748b;cursor:pointer;transition:all 0.2s;user-select:none;}
  .pill.on{background:rgba(99,202,183,0.1);border-color:#63cab7;color:#63cab7;}
  #controls{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;background:rgba(3,7,18,0.95);border-top:1px solid rgba(99,202,183,0.2);flex-shrink:0;}
  .btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,0.05);border:1px solid rgba(99,202,183,0.3);border-radius:12px;padding:8px 14px;color:#94a3b8;font-size:10px;font-family:'Inter',sans-serif;cursor:pointer;transition:all 0.2s;min-width:64px;text-transform:uppercase;}
  .btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .btn:active{transform:scale(0.93);}
  .btn.on{background:rgba(99,202,183,0.15);border-color:#63cab7;color:#63cab7;}
  .btn.rec-on{background:rgba(239,68,68,0.2);border-color:#ef4444;color:#ef4444;}
  .btn.yellow{border-color:rgba(251,191,36,0.4);color:#fbbf24;}
  #rec-badge{position:absolute;top:14px;right:14px;display:none;align-items:center;gap:6px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);border-radius:20px;padding:4px 10px;font-size:11px;font-family:'Orbitron',monospace;color:#ef4444;z-index:20;}
  #rec-badge.show{display:flex;}
  .recdot{width:7px;height:7px;border-radius:50%;background:#ef4444;animation:blink 1s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
  #start-screen{position:absolute;inset:0;background:#030712;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:200;}
  #start-screen h2{font-family:'Orbitron',monospace;font-size:18px;color:#63cab7;letter-spacing:3px;}
  #start-screen p{font-size:12px;color:#64748b;text-align:center;max-width:260px;line-height:1.6;}
  #start-btn{background:rgba(99,202,183,0.15);border:1px solid #63cab7;border-radius:30px;padding:14px 32px;color:#63cab7;font-family:'Orbitron',monospace;font-size:13px;letter-spacing:2px;cursor:pointer;transition:all 0.2s;}
  #start-btn:active{transform:scale(0.95);background:rgba(99,202,183,0.25);}
  #loading-overlay{position:absolute;inset:0;background:#030712;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100;}
  #loading-overlay.show{display:flex;}
  .ring{width:48px;height:48px;border:2px solid rgba(99,202,183,0.2);border-top-color:#63cab7;border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #load-text{font-family:'Orbitron',monospace;font-size:11px;color:#63cab7;letter-spacing:2px;text-align:center;}
  #toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(99,202,183,0.15);border:1px solid rgba(99,202,183,0.4);border-radius:20px;padding:8px 20px;font-size:12px;color:#63cab7;font-family:'Orbitron',monospace;letter-spacing:1px;opacity:0;transition:all 0.3s;z-index:50;pointer-events:none;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="header">
  <h1>SilhouetteVision</h1>
  <div style="display:flex;align-items:center;gap:8px">
    <span id="fps">-- FPS</span>
    <div id="status-dot"></div>
  </div>
</div>

<div id="canvas-container">
  <video id="videoEl" playsinline muted autoplay></video>
  <canvas id="outputCanvas"></canvas>
  <canvas id="overlayCanvas"></canvas>
  <div id="rec-badge"><div class="recdot"></div> REC</div>

  <!-- pantalla inicial con botón explícito -->
  <div id="start-screen">
    <h2>SILHOUETTE VISION</h2>
    <p>Detección de siluetas, edad y emociones en tiempo real.<br>Se requiere acceso a la cámara.</p>
    <button id="start-btn" onclick="boot()">INICIAR CÁMARA</button>
  </div>

  <div id="loading-overlay">
    <div class="ring"></div>
    <div id="load-text">CARGANDO...</div>
  </div>
</div>

<div id="toggle-bar">
  <div class="pill on" id="pill-silueta" onclick="tog('silueta')">Silueta</div>
  <div class="pill on" id="pill-edad"    onclick="tog('edad')">Edad</div>
  <div class="pill on" id="pill-emocion" onclick="tog('emocion')">Emoción</div>
</div>

<div id="controls">
  <button class="btn on" id="btn-cam" onclick="toggleCam()">
    <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>Cámara
  </button>
  <button class="btn yellow" onclick="capture()">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M20.94 13A8.994 8.994 0 1 1 11 3.06V1h2v2.06A9 9 0 0 1 20.94 13z"/></svg>Captura
  </button>
  <button class="btn" id="btn-rec" onclick="toggleRec()">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>Grabar
  </button>
  <button class="btn" onclick="flipCam()">
    <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>Voltear
  </button>
</div>

<div id="toast"></div>

<script>
// ── refs ─────────────────────────────────────────────────────────────
const videoEl       = document.getElementById('videoEl');
const outCvs        = document.getElementById('outputCanvas');
const ovrCvs        = document.getElementById('overlayCanvas');
const ctx           = outCvs.getContext('2d');
const octx          = ovrCvs.getContext('2d');
const startScreen   = document.getElementById('start-screen');
const loadingOvl    = document.getElementById('loading-overlay');
const loadText      = document.getElementById('load-text');
const statusDot     = document.getElementById('status-dot');
const fpsEl         = document.getElementById('fps');
const recBadge      = document.getElementById('rec-badge');

// ── state ─────────────────────────────────────────────────────────────
let camOn      = false;
let facing     = 'user';
let stream     = null;
let rafId      = null;
let recOn      = false;
let recorder   = null;
let chunks     = [];
let segReady   = false;
let faceReady  = false;
let seg        = null;
let segMask    = null;
let segBusy    = false;
let lastFaceT  = 0;
let lastFaces  = [];
let fc = 0, lastFpsT = performance.now();

const feat = { silueta: true, edad: true, emocion: true };
const COLORS = [{r:99,g:202,b:183},{r:167,g:139,b:250},{r:251,g:191,b:36},{r:248,g:113,b:113},{r:96,g:165,b:250}];
const EMO = {happy:'😊 Feliz',sad:'😢 Triste',angry:'😠 Enojado',fearful:'😨 Asustado',disgusted:'🤢 Disgustado',surprised:'😮 Sorprendido',neutral:'😐 Neutral'};

// ── utils ─────────────────────────────────────────────────────────────
function toast(msg, ms=2200) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

function resize() {
  const c = document.getElementById('canvas-container');
  outCvs.width = ovrCvs.width = c.offsetWidth;
  outCvs.height = ovrCvs.height = c.offsetHeight;
}
window.addEventListener('resize', resize);
resize();

function tog(f) {
  feat[f] = !feat[f];
  document.getElementById('pill-'+f).classList.toggle('on', feat[f]);
}

// ── boot (triggered by button) ────────────────────────────────────────
async function boot() {
  startScreen.style.display = 'none';
  loadingOvl.classList.add('show');

  // 1. Load mediapipe
  loadText.textContent = 'CARGANDO MEDIAPIPE...';
  await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js');
  await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js');

  seg = new SelfieSegmentation({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`
  });
  seg.setOptions({ modelSelection: 1, selfieMode: false });
  seg.onResults(r => { segMask = r.segmentationMask; });
  await seg.initialize();
  segReady = true;

  // 2. Load face-api models
  loadText.textContent = 'CARGANDO FACE-API...';
  try {
    if (typeof faceapi === 'undefined') throw new Error('faceapi lib no cargó');
    const MODEL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights/';
    loadText.textContent = 'PESOS TINY DETECTOR...';
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL);
    loadText.textContent = 'PESOS EDAD/GÉNERO...';
    await faceapi.nets.ageGenderNet.loadFromUri(MODEL);
    loadText.textContent = 'PESOS EMOCIONES...';
    await faceapi.nets.faceExpressionNet.loadFromUri(MODEL);
    faceReady = true;
  } catch(e) {
    console.error('face-api error:', e);
    // show error in UI
    const errDiv = document.createElement('div');
    errDiv.style.cssText = 'position:absolute;bottom:10px;left:10px;right:10px;background:rgba(239,68,68,0.2);border:1px solid #ef4444;border-radius:8px;padding:8px;font-size:10px;color:#ef4444;font-family:monospace;z-index:300;word-break:break-all;';
    errDiv.textContent = 'FACE-API ERR: ' + e.message;
    document.getElementById('canvas-container').appendChild(errDiv);
    setTimeout(() => errDiv.remove(), 8000);
  }

  // 3. Start camera
  loadText.textContent = 'ABRIENDO CÁMARA...';
  await startCam('user');
  loadingOvl.classList.remove('show');
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

// ── camera ────────────────────────────────────────────────────────────
async function startCam(mode) {
  // stop previous
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  videoEl.srcObject = null;
  segMask = null;

  facing = mode;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: mode }, width:{ideal:1280}, height:{ideal:720} },
      audio: false
    });
    videoEl.srcObject = stream;
    await videoEl.play();
    camOn = true;
    statusDot.classList.add('active');
    document.getElementById('btn-cam').classList.add('on');
    rafId = requestAnimationFrame(loop);
    toast(mode === 'user' ? 'CÁMARA FRONTAL' : 'CÁMARA TRASERA');
  } catch(e) {
    toast('ERROR: ' + e.name);
    console.error(e);
  }
}

async function stopCam() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  videoEl.srcObject = null;
  camOn = false; segMask = null;
  statusDot.classList.remove('active');
  document.getElementById('btn-cam').classList.remove('on');
  ctx.clearRect(0, 0, outCvs.width, outCvs.height);
  octx.clearRect(0, 0, ovrCvs.width, ovrCvs.height);
}

function toggleCam() { if (camOn) stopCam(); else startCam(facing); }

async function flipCam() {
  const next = facing === 'user' ? 'environment' : 'user';
  await startCam(next);
}

// ── segmentation ──────────────────────────────────────────────────────
async function sendSeg() {
  if (segBusy || !segReady || !camOn || videoEl.readyState < 2) return;
  segBusy = true;
  try { await seg.send({ image: videoEl }); } catch(e) {}
  segBusy = false;
}

function drawSilhouette(mask) {
  const W = outCvs.width, H = outCvs.height;
  const c = COLORS[0];
  const off = new OffscreenCanvas(W, H);
  const ox  = off.getContext('2d');
  ox.drawImage(mask, 0, 0, W, H);
  const id = ox.getImageData(0, 0, W, H);
  const d  = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const a = d[i] / 255;
    if (a > 0.25) {
      d[i]=c.r; d[i+1]=c.g; d[i+2]=c.b; d[i+3]=Math.floor(a*155);
    } else { d[i+3]=0; }
  }
  ox.putImageData(id, 0, 0);
  ctx.save();
  ctx.drawImage(off, 0, 0);
  ctx.shadowColor=`rgba(${c.r},${c.g},${c.b},0.85)`;
  ctx.shadowBlur=22;
  ctx.globalCompositeOperation='screen';
  ctx.drawImage(off, 0, 0);
  ctx.restore();
}

// ── face detection ────────────────────────────────────────────────────
async function detectFaces() {
  if (!faceReady || videoEl.readyState < 2) return lastFaces;
  const now = performance.now();
  if (now - lastFaceT < 350) return lastFaces;
  lastFaceT = now;
  try {
    const opts = new faceapi.TinyFaceDetectorOptions({ inputSize:224, scoreThreshold:0.4 });
    lastFaces = await faceapi.detectAllFaces(videoEl, opts).withAgeAndGender().withFaceExpressions() || [];
  } catch(e) { lastFaces = []; }
  return lastFaces;
}

function drawLabels(faces) {
  const W = outCvs.width, H = outCvs.height;
  octx.clearRect(0, 0, W, H);
  const vw = videoEl.videoWidth  || W;
  const vh = videoEl.videoHeight || H;
  const sx = W / vw, sy = H / vh;

  faces.forEach((det, i) => {
    const box = det.detection.box;
    const bx = box.x*sx, by = box.y*sy, bw = box.width*sx, bh = box.height*sy;
    const c = COLORS[i % COLORS.length];
    const col = `rgb(${c.r},${c.g},${c.b})`;

    octx.strokeStyle = col; octx.lineWidth = 1.5;
    octx.shadowColor = col; octx.shadowBlur = 8;
    octx.strokeRect(bx, by, bw, bh);
    octx.shadowBlur = 0;

    const lines = [];
    if (feat.edad && det.age != null)
      lines.push(`${det.gender==='male'?'♂':'♀'} ~${Math.round(det.age)} años`);
    if (feat.emocion && det.expressions) {
      const top = Object.entries(det.expressions).reduce((a,b)=>a[1]>b[1]?a:b);
      lines.push(EMO[top[0]] || top[0]);
    }
    if (!lines.length) return;

    const fs = Math.max(11, Math.min(15, bw*0.12));
    octx.font = `500 ${fs}px 'Orbitron',monospace`;
    const maxW = lines.reduce((m,l)=>Math.max(m,octx.measureText(l).width),0);
    const px=10, py=6, lh=fs+7;
    const lbH = lines.length*lh+py*2;
    const lbY = Math.max(0, by-lbH-6);

    octx.fillStyle='rgba(3,7,18,0.85)';
    octx.beginPath(); octx.roundRect(bx,lbY,maxW+px*2,lbH,6); octx.fill();
    octx.strokeStyle=col; octx.lineWidth=1;
    octx.shadowColor=col; octx.shadowBlur=5;
    octx.beginPath(); octx.roundRect(bx,lbY,maxW+px*2,lbH,6); octx.stroke();
    octx.shadowBlur=0;
    octx.fillStyle=col;
    lines.forEach((l,li)=>octx.fillText(l, bx+px, lbY+py+(li+1)*lh-4));
  });
}

// ── render loop ───────────────────────────────────────────────────────
async function loop() {
  if (!camOn) return;
  const W = outCvs.width, H = outCvs.height;

  fc++; const now = performance.now();
  if (now - lastFpsT >= 1000) {
    fpsEl.textContent = fc + ' FPS'; fc = 0; lastFpsT = now;
  }

  ctx.clearRect(0, 0, W, H);
  if (videoEl.readyState >= 2) ctx.drawImage(videoEl, 0, 0, W, H);

  if (feat.silueta) {
    sendSeg();
    if (segMask) drawSilhouette(segMask);
  }

  if (faceReady && (feat.edad || feat.emocion)) {
    const faces = await detectFaces();
    drawLabels(faces);
  } else {
    octx.clearRect(0, 0, ovrCvs.width, ovrCvs.height);
  }

  rafId = requestAnimationFrame(loop);
}

// ── recording ─────────────────────────────────────────────────────────
function toggleRec() {
  if (!camOn) { toast('ACTIVA LA CÁMARA'); return; }
  if (recOn) {
    recorder.stop(); recOn = false;
    document.getElementById('btn-rec').classList.remove('rec-on');
    recBadge.classList.remove('show');
  } else {
    chunks = [];
    const s = outCvs.captureStream(30);
    const mime = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4']
      .find(m => MediaRecorder.isTypeSupported(m)) || '';
    recorder = new MediaRecorder(s, mime ? {mimeType:mime} : {});
    recorder.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };
    recorder.onstop = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
      a.download = 'silueta_'+Date.now()+'.webm'; a.click();
      toast('VIDEO GUARDADO');
    };
    recorder.start(100); recOn = true;
    document.getElementById('btn-rec').classList.add('rec-on');
    recBadge.classList.add('show');
    toast('● GRABANDO');
  }
}

// ── capture ───────────────────────────────────────────────────────────
function capture() {
  if (!camOn) { toast('ACTIVA LA CÁMARA'); return; }
  const s = document.createElement('canvas');
  s.width = outCvs.width; s.height = outCvs.height;
  const sc = s.getContext('2d');
  sc.drawImage(outCvs, 0, 0); sc.drawImage(ovrCvs, 0, 0);
  s.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'captura_'+Date.now()+'.png'; a.click();
    toast('CAPTURA GUARDADA');
  }, 'image/png');
  const f = document.createElement('div');
  f.style.cssText='position:absolute;inset:0;background:white;opacity:0.7;pointer-events:none;z-index:200;transition:opacity 0.4s';
  document.getElementById('canvas-container').appendChild(f);
  setTimeout(()=>f.style.opacity='0',50); setTimeout(()=>f.remove(),500);
}
</script>
</body>
</html>
